name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'AndroidClient/**'
      - 'shared/schemas/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (patch / minor / major). Leave empty to auto-detect from commits.'
        required: false
        default: ''

# Prevent parallel version bumps if pushes arrive in quick succession.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b  # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: android-v
          default_bump: ${{ inputs.bump || 'patch' }}
          release_branches: main

  release:
    name: Build & Release APK
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: AndroidClient

      - name: Build release APK
        working-directory: AndroidClient
        env:
          ANDROID_VERSION: ${{ needs.bump-version.outputs.new_tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          files: AndroidClient/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true