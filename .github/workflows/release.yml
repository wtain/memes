name: Release

on:
  push:
    tags:
      - 'v*'
      - 'backend-v*'

jobs:
  test:
    name: Test Release
    uses: ./.github/workflows/backend-tests.yml

  build:
    name: Build Release
    uses: ./.github/workflows/backend-docker.yml
    needs: test

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: tag_name
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "CHANGELOG=$(git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo 'HEAD~10')..HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag_name.outputs.VERSION }}
        release_name: Release ${{ steps.tag_name.outputs.VERSION }}
        body: |
          ## Changes
          ${{ steps.tag_name.outputs.CHANGELOG }}

          ## Docker Image
          ```bash
          docker pull ghcr.io/${{ github.repository }}/backend:${{ steps.tag_name.outputs.VERSION }}
          ```

          ## Release Details
          - Backend API service
          - Tests passing
          - Docker image ready for deployment
        draft: false
        prerelease: ${{ contains(steps.tag_name.outputs.VERSION, 'alpha') || contains(steps.tag_name.outputs.VERSION, 'beta') }}