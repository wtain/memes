name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'AndroidClient/**'
      - 'shared/schemas/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'AndroidClient/**'
      - 'shared/schemas/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          build-root-directory: AndroidClient

      - name: Build debug APK
        working-directory: AndroidClient
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: AndroidClient/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          build-root-directory: AndroidClient

      - name: Run unit tests
        working-directory: AndroidClient
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: AndroidClient/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  instrumented-tests:
    name: Instrumented Tests (API 31)
    runs-on: ubuntu-latest
    # Skip on draft PRs to keep CI fast (~15 min with emulator).
    if: github.event_name == 'push' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          build-root-directory: AndroidClient

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Must stay >=31: androidx.activity 1.13.0 makes ComponentActivity
          # implement a callback referencing android.app.PictureInPictureUiState
          # (API 31+ only). MockK's reflection-based method scan touches that
          # class on any lower API level and crashes every instrumented test
          # that pauses an Activity while any mock exists -- unrelated to PiP.
          # Confirmed upstream MockK bug (mockk/mockk#1518), fix merged
          # upstream (mockk/mockk#1531) but not in any released mockk version
          # as of 2026-07-21. minSdk stays 29; only this test target moved.
          api-level: 31
          arch: x86_64
          profile: pixel_3a
          avd-name: test_device
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd AndroidClient && gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: AndroidClient/app/build/reports/androidTests/connected/
          retention-days: 14