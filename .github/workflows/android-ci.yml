name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'AndroidClient/**'
      - 'shared/schemas/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'AndroidClient/**'
      - 'shared/schemas/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          build-root-directory: AndroidClient

      - name: Build debug APK
        working-directory: AndroidClient
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: AndroidClient/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          build-root-directory: AndroidClient

      - name: Run unit tests
        working-directory: AndroidClient
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: AndroidClient/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  instrumented-tests:
    name: Instrumented Tests (API 31)
    runs-on: ubuntu-latest
    # Skip on draft PRs to keep CI fast (~15 min with emulator).
    if: github.event_name == 'push' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          build-root-directory: AndroidClient

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Must stay >=31: androidx.activity 1.13.0 makes ComponentActivity
          # implement a callback referencing android.app.PictureInPictureUiState
          # (API 31+ only). MockK's reflection-based method scan touches that
          # class on any lower API level and crashes every instrumented test
          # that pauses an Activity while any mock exists -- unrelated to PiP.
          # Confirmed upstream MockK bug (mockk/mockk#1518), fix merged
          # upstream (mockk/mockk#1531) but not in any released mockk version
          # as of 2026-07-21. minSdk stays 29; only this test target moved.
          api-level: 31
          arch: x86_64
          profile: pixel_3a
          avd-name: test_device
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd AndroidClient && gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: AndroidClient/app/build/reports/androidTests/connected/
          retention-days: 14

  smoke-test-min-sdk:
    name: Smoke Test (API 29 — real minSdk floor)
    runs-on: ubuntu-latest
    needs: build-apk
    # Skip on draft PRs to keep CI fast (~10 min with emulator).
    if: github.event_name == 'push' || !github.event.pull_request.draft
    # Instrumented tests moved to API 31 (see comment above) to work around
    # an upstream MockK bug -- MockK's reflection crashes on API <31, unrelated
    # to any real app/OS behavior difference. That leaves API 29 (the actual
    # minSdk) with zero automated coverage. This job closes that gap cheaply:
    # no MockK, no Espresso/Compose test APIs -- just install the real debug
    # APK on an API 29 emulator, launch it, and confirm it doesn't crash.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: apk

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on API 29, verify no crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          avd-name: smoke_test_device
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner's `script` input runs each line as its own
          # separate `sh -c` invocation (see ReactiveCircus/android-emulator-runner
          # src/script-parser.ts) -- variables set on one line are gone on the
          # next. Multi-step logic has to live in an actual script file, hence
          # this one-liner calling out to smoke_test_min_sdk.sh.
          script: bash AndroidClient/scripts/smoke_test_min_sdk.sh apk