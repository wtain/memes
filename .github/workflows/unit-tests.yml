name: Unit Tests

# The DB-free test roots that no other workflow runs (backend-tests.yml runs Backend/tests, integration-tests.yml
# runs tests/integration, tests/docs and tests/sync, backend-docker.yml runs tests/docker). Each root is its OWN
# pytest step: the roots have different asyncio modes and must never be combined in one command (see CLAUDE.md).
# tests/docs/test_workflow_test_roots.py fails when a test root is run by no workflow.

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'rules/**'
      - 'parse/**'
      - 'retrieval/**'
      - 'taxonomy/**'
      - 'evaluation/**'
      - 'ai/**'
      - 'batch/**'
      - 'config/**'
      - 'repository/**'
      - 'Storage/**'
      - 'shared/**'
      - 'environments/settings*.yaml'
      - 'tests/**'
      - 'requirements.txt'
      - 'Backend/requirements-backend.txt'
      - 'Backend/requirements-test.txt'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'rules/**'
      - 'parse/**'
      - 'retrieval/**'
      - 'taxonomy/**'
      - 'evaluation/**'
      - 'ai/**'
      - 'batch/**'
      - 'config/**'
      - 'repository/**'
      - 'Storage/**'
      - 'shared/**'
      - 'environments/settings*.yaml'
      - 'tests/**'
      - 'requirements.txt'
      - 'Backend/requirements-backend.txt'
      - 'Backend/requirements-test.txt'
      - '.github/workflows/unit-tests.yml'

jobs:
  unit:
    name: Unit test roots (Python 3.11)
    runs-on: ubuntu-latest
    env:
      # Placeholder only: modules that import Storage.db at module level need some DATABASE_URL to import;
      # none of these roots connects to a database.
      DATABASE_URL: postgresql+asyncpg://ocr:ocr@localhost:5432/ocrdb_test
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r Backend/requirements-backend.txt
          pip install -r Backend/requirements-test.txt
          # Light pins from the root requirements.txt (not the heavy ML/batch stack): the rules engine and
          # normalisation need wordfreq, pymorphy3, snowballstemmer and RapidFuzz; the taxonomy and evaluation
          # roots need numpy, PyYAML and pillow.
          pip install wordfreq==3.1.1 pymorphy3==2.0.6 pymorphy3-dicts-ru==2.4.417150.4580142 snowballstemmer==3.1.1 RapidFuzz==3.14.5 PyYAML==6.0.2 numpy==2.2.6 pillow==12.0.0 ollama==0.6.2

      # Blocking roots: green locally with the project venv on 2026-11-20.
      - name: Rules engine tests
        run: pytest tests/rules/ -v --tb=short

      - name: Query parser tests (includes the AST purity test)
        run: pytest tests/parse/ -v --tb=short

      - name: Retrieval tests (includes the AST purity test)
        run: pytest tests/retrieval/ -v --tb=short

      - name: Taxonomy tests
        run: pytest tests/taxonomy/ -v --tb=short

      - name: Comics tests
        run: pytest tests/comics/ -v --tb=short

      # Non-blocking roots: they import the heavy ML/batch stack (sentence-transformers, scikit-learn, hdbscan,
      # ...) that the light install above does not provide, or are red today (tests/batch: 6-7 failures in
      # test_build_lemma_clusters.py, which reads env vars / APP_ENV). Promote each to blocking once it is green
      # in CI.
      - name: Evaluation tests (non-blocking)
        continue-on-error: true
        run: pytest tests/evaluation/ -v --tb=short

      - name: AI integration tests (non-blocking)
        continue-on-error: true
        run: pytest tests/ai/ -v --tb=short

      - name: Batch tests under tests/ (non-blocking, red today)
        continue-on-error: true
        run: pytest tests/batch/ -v --tb=short

      - name: Batch tests under batch/tests (non-blocking)
        continue-on-error: true
        run: pytest batch/tests/ -v --tb=short
