name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'Frontend/memes-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Frontend/memes-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: Frontend/memes-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Frontend/memes-frontend

      - name: Lint
        run: pnpm lint:ci
        working-directory: Frontend/memes-frontend

      - name: Test
        run: pnpm test
        working-directory: Frontend/memes-frontend

      - name: Check generated types are up to date
        working-directory: Frontend
        run: |
          bash generate-types.sh
          git diff --exit-code memes-frontend/src/types/generated/

      - name: Build (smoke check)
        run: pnpm build
        working-directory: Frontend/memes-frontend
        env:
          VITE_BACKEND_API_URL: http://localhost:8000
