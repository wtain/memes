name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - 'Storage/**'
      - 'repository/**'
      - 'rules/**'
      - 'ai/**'
      - 'embeddingutils/**'
      - 'graph/**'
      - 'metrics/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - 'Storage/**'
      - 'repository/**'
      - 'rules/**'
      - 'ai/**'
      - 'embeddingutils/**'
      - 'graph/**'
      - 'metrics/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Show environment
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r Backend/requirements-backend.txt
        pip install -r Backend/requirements-test.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 Backend/app Backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 Backend/app Backend/tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        cd Backend
        pytest tests/ -v --tb=short

    - name: Generate test report
      if: always()
      run: |
        cd Backend
        pytest tests/ --tb=short --junit-xml=test-results.xml
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-results-${{ matrix.python-version }}
        path: Backend/test-results.xml
        retention-days: 30