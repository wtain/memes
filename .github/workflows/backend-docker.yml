name: Backend Docker Build

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - 'Storage/**'
      - 'requirements.txt'
      - 'Dockerfile.backend'
      - '.dockerignore'
      - 'batch/registry.py'
      - 'batch/clusterize.py'
      - '.github/workflows/backend-docker.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - 'Storage/**'
      - 'requirements.txt'
      - 'Dockerfile.backend'
      - '.dockerignore'
      - 'batch/registry.py'
      - 'batch/clusterize.py'
  release:
    types: [ published ]

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # For 'release' events, only run when the tag is a backend release.
    # android-v* releases also publish a GitHub Release which would otherwise trigger this job.
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/backend-v')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/${{ github.repository }}/backend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.backend
        push: ${{ github.event_name != 'pull_request' }}
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend:buildcache
        cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/backend:buildcache,mode=max', github.repository) || '' }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install test dependencies
      run: pip install pytest

    - name: Smoke-test the built image actually boots
      run: pytest tests/docker/ -v --tb=short

    - name: Export Docker image
      run: docker save ghcr.io/${{ github.repository }}/backend | gzip > backend-image.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v7
      with:
        name: backend-docker-image-${{ github.sha }}
        path: backend-image.tar.gz
        retention-days: 7

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4.37.3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true