name: Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'batch/rebuild_duplicates.py'
      - 'batch/clusterize.py'
      - 'batch/extract_text_from_memes.py'
      - 'Storage/**'
      - 'repository/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'batch/rebuild_duplicates.py'
      - 'batch/clusterize.py'
      - 'batch/extract_text_from_memes.py'
      - 'Storage/**'
      - 'repository/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration:
    name: Integration Tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocr
          POSTGRES_PASSWORD: ocr
          POSTGRES_DB: ocrdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ocr:ocr@localhost:5432/ocrdb_test
      BASE_PATH: /tmp/test_images

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r Backend/requirements-backend.txt
          pip install -r Backend/requirements-test.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ocr psql -h localhost -U ocr -d ocrdb_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short