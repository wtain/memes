name: Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'batch/rebuild_duplicates.py'
      - 'batch/clusterize.py'
      - 'batch/extract_text_from_memes.py'
      - 'Storage/**'
      - 'repository/**'
      - 'Backend/app/repositories/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'batch/rebuild_duplicates.py'
      - 'batch/clusterize.py'
      - 'batch/extract_text_from_memes.py'
      - 'Storage/**'
      - 'repository/**'
      - 'Backend/app/repositories/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration:
    name: Integration Tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocr
          POSTGRES_PASSWORD: ocr
          POSTGRES_DB: ocrdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ocr:ocr@localhost:5432/ocrdb_test
      BASE_PATH: /tmp/test_images

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r Backend/requirements-backend.txt
          pip install -r Backend/requirements-test.txt
          # rules/lang_plausibility.py, rules/normalize.py, and batch/build_bow.py (exercised
          # transitively by repository/ocr_text.py and the new tests/integration tests) need
          # these, and repository/ocr_text.py itself imports numpy directly. Installed
          # explicitly here rather than via the top-level requirements.txt, which pulls in the
          # full ML/batch stack (opencv/paddleocr) that Backend/requirements-backend.txt exists
          # specifically to avoid — see that file's header comment.
          #
          # ollama is the thin HTTP client `ai/ollama.py` imports at module level (needed to
          # collect tests/integration/test_build_image_descriptions.py, which only exercises
          # DB logic and never actually calls Ollama) — not part of the heavy ML stack, safe
          # to install standalone here.
          pip install wordfreq==3.1.1 pymorphy3==2.0.6 pymorphy3-dicts-ru==2.4.417150.4580142 PyYAML==6.0.2 numpy==2.2.6 ollama==0.6.1

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ocr psql -h localhost -U ocr -d ocrdb_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short