# Tracked configuration of the production Postgres (design: P5d, "Postgres per environment"). It REPLACES the image's
# postgresql.conf (compose starts the server with config_file=/etc/memes/postgresql.conf); anything not set here is the
# compiled-in default. shared_buffers and max_connections are overridden per environment on the command line (compose.yaml,
# keys PG_SHARED_BUFFERS and PG_MAX_CONNECTIONS in the env file); the values below are the defaults.

# --- connections: the container sits on a private project network and a host-loopback published port; no TLS needed
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
ssl = off
max_connections = 40
superuser_reserved_connections = 3

# --- authentication: scram only (pg_hba.conf is rendered per environment by provision.sh render)
hba_file = '/etc/memes/pg_hba.conf'
ident_file = '/dev/null'
password_encryption = scram-sha-256

# --- memory (estimates, unmeasured; see the design's RAM paragraph)
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
# raised per session by the owner for the HNSW rebuild after the first seed
maintenance_work_mem = 128MB

# --- no statement text and no connection chatter in the logs (logs go to stderr -> docker json-file, rotated)
logging_collector = off
log_statement = none
log_min_error_statement = panic
log_min_duration_statement = -1
log_connections = off
log_disconnections = off
log_min_messages = warning
log_error_verbosity = terse

# --- housekeeping
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'
