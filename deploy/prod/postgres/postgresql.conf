# Tracked configuration of the production Postgres (design: P5d, "Postgres per environment"). It REPLACES the image's
# postgresql.conf (compose starts the server with config_file=/etc/memes/postgresql.conf); anything not set here is the
# compiled-in default. shared_buffers and max_connections are overridden per environment on the command line (compose.yaml,
# keys PG_SHARED_BUFFERS and PG_MAX_CONNECTIONS in the env file); the values below are the defaults.

# --- connections: the container sits on a private project network and a host-loopback published port; no TLS needed
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
ssl = off
max_connections = 40
superuser_reserved_connections = 3

# --- authentication: scram over TCP; the exporter role alone uses peer over the socket through the map in pg_ident.conf
# (both files are rendered per environment by provision.sh render)
hba_file = '/etc/memes/pg_hba.conf'
ident_file = '/etc/memes/pg_ident.conf'
password_encryption = scram-sha-256

# --- memory (estimates, unmeasured; see the design's RAM paragraph)
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
# raised per session by the owner for the HNSW rebuild after the first seed
maintenance_work_mem = 128MB

# --- logs: files in /var/log/postgresql (compose mounts ${LOGS_DIR}/postgres there, owned by the postgres uid), bounded and terse.
# NEVER set log_statement, log_min_duration_statement or log_connections: they write statement text (and with it parameter values)
# or per-connection lines. log_min_error_statement = panic keeps the STATEMENT line out of every error, and terse verbosity drops
# DETAIL, HINT, QUERY and CONTEXT (those carry offending key values and, for log_lock_waits, the text of the blocking query).
# The primary message of an error can still name a value (for example a rejected cast), so clients bind typed parameters.
logging_collector = on
log_directory = '/var/log/postgresql'
# A NEW file at every rotation: the name carries the second, so a size rotation can never reuse a name (a weekday name was appended
# to past 20MB). Each file stops at 20MB (log_rotation_size) or one day (log_rotation_age). Postgres does not limit the NUMBER of
# files: postgres/prune_logs.py does (newest 10 files, 200MB total per environment; `provision.sh prune-logs <env>`, run periodically).
# log_truncate_on_rotation only matters when a name repeats, which these names do not; it stays as a harmless safety.
log_filename = 'postgresql-%Y%m%d-%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 20MB
log_truncate_on_rotation = on
log_min_error_statement = panic
log_error_verbosity = terse
log_min_messages = warning
log_disconnections = off
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 5min

# --- housekeeping
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'
