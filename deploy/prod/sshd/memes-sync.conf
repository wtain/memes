# /etc/ssh/sshd_config.d/00-memes-sync.conf -- installed by host/setup-host.sh (P5d-T5) with @ADMIN_USER@ replaced.
# Named 00- so it is read before cloud-init's 50-cloud-init.conf: for most keywords sshd keeps the FIRST value it sees.
# Check with `sshd -t` and `sshd -T -C user=memeup-metal,host=x,addr=1.2.3.4` before reloading; keep a second session open.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
# AcceptEnv is left at the distribution default (LANG, LC_*): the gate reads MEMESYNC_GATE_CONF from the environment only for tests, and
# no variable a client can send reaches it. Do NOT add AcceptEnv lines for anything else. (An empty `AcceptEnv` is a syntax error.)
AllowUsers @ADMIN_USER@ memesync-metal memesync-general memesync-it memeup-metal memeup-general memeup-it memesync-obs

# Verb key + tunnel key of one environment. The keys live in a root-owned file the account cannot edit; the authorized_keys
# options (restrict, command=, permitopen=) are the first layer, the lines below the second. TCP forwarding is allowed only
# to that environment's Postgres on the host loopback. The shell must be /bin/sh: sshd runs a forced command through it.
Match User memesync-metal
    AuthorizedKeysFile /etc/ssh/memes-keys/%u
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:6432
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    AllowStreamLocalForwarding no
    MaxSessions 4
    MaxAuthTries 3

Match User memesync-general
    AuthorizedKeysFile /etc/ssh/memes-keys/%u
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:6434
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    AllowStreamLocalForwarding no
    MaxSessions 4
    MaxAuthTries 3

Match User memesync-it
    AuthorizedKeysFile /etc/ssh/memes-keys/%u
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:6436
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    AllowStreamLocalForwarding no
    MaxSessions 4
    MaxAuthTries 3

# Observability tunnel: one key on one account for all three environments (the workstation's Grafana). Forwarding only to Prometheus on
# the host loopback; the key line adds command="/bin/false". Same layer pattern as the sync accounts above.
Match User memesync-obs
    AuthorizedKeysFile /etc/ssh/memes-keys/%u
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:9090
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    AllowStreamLocalForwarding no
    MaxSessions 2
    MaxAuthTries 3

# Upload accounts: sftp only, jailed in /srv/memes/<env>/staging (the account's home; root-owned, not writable), no shell,
# no forwarding. `-u 007` makes uploaded tars 0660 so the group memesync-<env> (the gate) can read and delete them.
Match User memeup-metal,memeup-general,memeup-it
    AuthorizedKeysFile /etc/ssh/memes-keys/%u
    ChrootDirectory %h
    ForceCommand internal-sftp -u 007
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 2
    MaxAuthTries 3
