version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: ocr-db
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
      POSTGRES_DB: ocrdb
    volumes:
      - memes_pg:/var/lib/postgresql
    ports:
      - "5432:5432"

  common_memes_db:
    image: pgvector/pgvector:pg18-trixie
    container_name: common-memes-db
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
      POSTGRES_DB: ocrdb
    volumes:
      - common_memes_pg:/var/lib/postgresql
    ports:
      - "5434:5432"

  it_memes_db:
    image: pgvector/pgvector:pg18-trixie
    container_name: it-memes-db
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
      POSTGRES_DB: ocrdb
    volumes:
      - it_memes_pg:/var/lib/postgresql
    ports:
      - "5436:5432"

volumes:
  memes_pg:
  common_memes_pg:
  it_memes_pg: