general:
  tagging_profile: general
  frontend_origin: http://localhost:5174

scheduler:
  enabled: true
  # Appended to the common scheduler.jobs list in settings.yaml (Dynaconf merge); general only.
  jobs:
    - name: export_ratings
      script: export_ratings
      batch_run_kind: export_ratings
      interval_minutes: 1440
      max_runtime_minutes: 10
      enabled: true
    - name: import_judgments
      script: import_judgments
      batch_run_kind: import_judgments
      interval_minutes: 10080
      max_runtime_minutes: 10
      enabled: true

rules:
  file: data/rules.general.json
  lemmatize: true

bow:
  output_file: output/bow.general.json
  unmatched_file: output/bow.unmatched.general.json
  ignore_file: data/ignore-words.general.json

concepts:
  text_concepts_file: data/text-concepts.general.json
  text_concepts_templates_file: data/text-concepts.templates.general.json
  images_dir: images-general
  mapping_file: data/concepts-to-tags.general.json

lemma_clustering:
  # Empirically validated for this environment's OCR data (see CLAUDE.md's
  # Concept discovery note) — leaf avoids one oversized catch-all cluster.
  selection_method: leaf
  OUTPUT_FILE: output/lemma_clusters.general.ru.yaml

trends:
  labels: ["person", "organization", "location"]
  model: urchade/gliner_multi-v2.1

image_descriptions:
  model: qwen2.5vl:7b
  prompts_file: data/image-description-prompts.general.yaml

meme_profiles:
  text_model: qwen2.5:7b-instruct   # chosen by the P2 pilot, 2026-10-03 (docs/superpowers/reviews/2026-10-03-p2-pilot-review.md)

parse:
  model: qwen2.5:7b-instruct   # placeholder until the P3 model comparison (docs/superpowers/specs/2026-10-02-meme-from-text/2026-10-05-p3-query-understanding-design.md)
