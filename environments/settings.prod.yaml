# Tracked settings that apply on top of the common file and the environment's own overlay when the process
# runs with APP_STAGE=prod (the production backend image bakes it in). No secrets: DATABASE_URL, BASE_PATH,
# BUG_REPORTS_PATH, APP_ENV, APP_STAGE and the frontend origins come from the VPS env file.
# A per-environment settings.<env>.prod.yaml may be layered on top of this file (a missing file is ignored).
# Design: docs/superpowers/specs/2026-11-12-environment-data-sync/2026-11-12-p5-prod-provisioning-and-hardening-design.md (P5a).

stage: prod

# The container runs no pipelines and no scheduler. settings.<env>.yaml sets this true for the developer
# environments, so it has to be switched off again here.
scheduler:
  enabled: false

# An overlay cannot delete a key, so the parser is switched off with an empty model (parse.load_config
# treats a falsy model as "not configured"; /api/meme-from-text/search then answers `available: false`).
parse:
  model: ""

# Browser origins allowed to call the API. Production hostnames only (set in settings.<env>.prod.yaml); the
# developer origins (localhost) are not allowed on prod. Cookies and credentials are never used.
cors:
  origins: []
  allow_credentials: false

# Abuse bounds (P5a-5). Process-local, so the effective limit is workers x rate (two workers).
abuse:
  max_clients: 10000
  saves_per_min: 30
  not_found_per_min: 20
  bug_reports_per_min: 5
  telemetry_per_min: 120
  meme_search_per_min: 20       # each call costs an Ollama parse and embedding; a person types a message every few seconds at most
  recording_per_min: 1200       # a search records one history row and up to 50 impression rows
  max_q_chars: 512
  max_facets: 10
  max_facet_value_chars: 64

history:
  record_browse: false

popularity:
  impressions:
    max_rows_per_call: 50

bug_reports:
  max_body_mb: 11               # a 10 MB file plus the multipart framing
  max_files: 200
  max_total_mb: 200

# Two workers x (5 + 5) = 20 connections per environment; the database role limit of P5d is sized from it.
database:
  pool_size: 5
  max_overflow: 5

# Request metrics on (served by the sidecar, see the observability spec).
observability:
  metrics: {enabled: true}
  slow_request_ms: 2000
  log_file: {dir: /var/log/memes, max_bytes: 10485760, backup_count: 4}   # /srv/memes/<env>/logs/backend on the host
