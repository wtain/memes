ocr:
  confidence_min: 0.4
  lang_score_min: 0.3

recut:                          # screenshot recut, crop detection (docs/superpowers/specs/2026-10-17-screenshot-recut/2026-10-24-r2-crop-detection-design.md)
  min_removed_share: 0.07       # a proposal removes at least this share of the image area (spike floor)
  max_removed_share: 0.75       # ... and at most this share
  flat_tolerance: 7.0           # row/column intensity std-dev below this counts as flat margin
  ocr_overlap_max: 1.0          # drop a proposal when more than this share of an OCR region falls outside the box; 1.0 = guard off (calibration 2026-10-25: 0.15 dropped 44 of 118 good cuts and no bad ones)
  commit_interval: 200
  # max_cuts_per_run: 500       # optional cap on proposals cut per recut_pipeline run (passed to create_recut_cuts as --limit); unset = unlimited
  jpeg_quality: 95             # quality of a cut saved from a JPEG source (R3a); the source's subsampling is kept

rules:
  lemmatize: false

bow:
  min_word_length: 3
  min_frequency: 2
  text_source: ocr

lemma_clustering:
  text_scope: unmatched
  language: all
  min_cluster_size: 2
  selection_epsilon: 0.0
  selection_method: eom
  text_embed_model: sbert

concepts:
  lookup: false
  threshold: 0.2
  limit: 50

ollama:
  model: qwen2
  enabled: true

image_descriptions:
  model: llava
  num_ctx: 8192
  batch_size: 50
  # Optional cap on images described per description_pipeline run (passed as --limit). Unset
  # means unlimited. Set per environment from measured Ollama throughput so one slice finishes
  # well under an hour; re-trigger the pipeline until the backlog is empty. See
  # docs/superpowers/specs/2026-10-01-description-tagging-pipeline-driver-design.md.
  # max_per_run: 500

general:
  batch_size: 100
  progress_every: 10
  profile: general
  frontend_origin: http://localhost:5173

search:
  fuzzy_min_lemma_length: 5
  fuzzy_similarity_threshold: 0.35
  phonetic_min_lemma_length: 5
  # Relevance ranking for text queries (docs/superpowers/specs/2026-10-01-search-result-ranking-design.md).
  # A hit's weight is source_weight * tier_weight; a token's score is its best hit, an image's score the sum over tokens.
  ranking:
    source_weights: {note: 1.0, ocr: 0.9, tag: 0.8, description: 0.6}
    # Note: description lemmas are stored as stems, so description stem-form matches score at the
    # exact tier; the stem tier is unreachable for the description source (its weight is never used).
    tier_weights: {exact: 1.0, stem: 0.8, fuzzy: 0.5, phonetic: 0.4}
    # Log a warning when one query matches more than this many images: the trigger to revisit
    # Python-side scoring (docs/adr/adr-2026-10-01-search-ranking-in-python.md).
    warn_match_count: 10000
  # Meme from text retrieval and fusion (epic meme-from-text, P4; see
  # docs/superpowers/specs/2026-10-02-meme-from-text/2026-10-07-p4-retrieval-fusion-and-api-design.md).
  # A missing key is a startup error. The weights come from `python -m evaluation tune-weights` on the gold set
  # (evaluation/gold/tuning/tune-1.json: cross-validated nDCG@10 0.386 against 0.355 for the former defaults, which
  # had situation 0.40); lexical only matters on degraded requests.
  meme_from_text:
    weights: {situation: 0.10, emotion: 0.15, stance: 0.10, topic: 0.15, tone: 0.10, lexical: 0.10}
    candidates: {situation_k: 300, axis_k: 300, lexical_k: 100, total_cap: 600}
    neutral_score: 0.3            # score of an axis the meme has no value on (FR-15): neutral, not a mismatch
    situation: {floor: 0.45, ceil: 0.85}   # cosine range rescaled to 0..1 (unrelated pairs 0.44-0.58, related 0.66-0.84)
    similarity: {use_neighbours: true}
    lexical: {enabled: true, max_tokens: 20, only_when_degraded: true}   # only the longest distinct tokens of a message are matched lexically; lexical matching costs ~250 ms p50 and over a second at p95 per request on the real library, so it runs only when the parse was degraded or the embedding failed, where it is the only signal left
    cache_ttl_seconds: 120
    embed_timeout_seconds: 2.0
    warm_interval_minutes: 20     # below parse.keep_alive (30m) so the models stay loaded
    parser_breaker: {failures: 3, open_seconds: 30}
    page: {default_limit: 20, max_limit: 50}
    query_log: {enabled: true}    # record each fresh message in search_history (kind meme_text); see docs/superpowers/specs/2026-10-02-meme-from-text/2026-10-10-query-log-and-gold-set-jobs-design.md

duplicates:
  # Candidate cutoff for rebuild_duplicates.py's KNN search -- cheap/loose, decides what's
  # worth storing in tmp_duplicates at all. Distinct from clusterize.py's own tighter
  # PROXIMITY_THRESHOLD (0.05), which decides what's shown as a confirmed duplicate cluster.
  # See docs/superpowers/specs/2026-07-25-duplicate-clustering-incremental-design.md.
  # Lowered from 0.3 to 0.12 on 2026-09-18 after empirical review of general's Tier B queue:
  # visual spot-checks across the full 0.05-0.22 range found CLIP conflating "same meme
  # template genre" (e.g. photo + bold caption bands, chat-screenshot layout) with genuine
  # near-duplication -- every sampled pair above ~0.05 was unrelated content sharing only a
  # visual template. 0.12 keeps a margin above Tier A's own 0.05 cutoff while cutting
  # general's then-current unreviewed Tier B backlog by ~96% (154,732 -> 6,386 pairs).
  threshold: 0.12
  # Neighbors considered per probe image. Empirically validated 2026-07-25 against real
  # tmp_duplicates data on metal (max real tight-band cluster degree: 8) and general (max: 37,
  # meaning k=20 was silently truncating real near-duplicate clusters there -- images beyond
  # the 20th-nearest were never fetched at all, not just filtered out). 50 gives headroom above
  # the observed worst case; kept as one global value rather than per-environment since raising
  # k costs sparse corpora (metal, it) nothing -- LIMIT k still filters by :threshold afterward,
  # so extra fetched-then-discarded candidates for low-density images don't change stored
  # results, only add a small uniform per-probe-image traversal cost.
  k: 50

clustering:
  splitting:
    # Governs clusterize.py's post-union-find shaping of tmp_clusters: clusters bigger
    # than max_cluster_size are recursively re-clustered at progressively tighter
    # thresholds (starting from clusterize.py's own PROXIMITY_THRESHOLD = 0.05) until
    # every resulting group is small enough, the threshold hits floor, or a tightening
    # step severs every remaining edge among the group's members at once (see
    # docs/superpowers/specs/2026-09-20-clusterize-oversized-cluster-data-loss.md),
    # whichever comes first; any member that ends up with no surviving edge at a given
    # threshold is dropped as an implicit singleton rather than written out as a size-1
    # cluster. Kept as its own group rather than folded into `duplicates` above since it
    # governs a different pipeline stage (confirmed-cluster shaping, not candidate-pair
    # discovery).
    #
    # Set enabled: false to fall back to clusterize.py's original behavior -- every
    # union-find cluster is written out exactly as found, however large, and singleton
    # clusters can't occur (today's algorithm only creates clusters via a connected pair).
    enabled: true
    max_cluster_size: 12
    # Subtracted from the current threshold on each recursive split attempt.
    decrement: 0.01
    # Once the next attempted threshold would drop below this floor, stop splitting and
    # accept the cluster oversized as-is -- these are genuinely near-identical images;
    # forcing a further split would be arbitrary rather than meaningful. With
    # decrement=0.01 off the 0.05 base, that's at most 4 attempts (0.04, 0.03, 0.02, 0.01).
    floor: 0.01
  ingestion_review_splitting:
    # Splits oversized IngestionService.list_clusters review cards into tight subgroups on
    # the fly -- presentational only, see
    # docs/superpowers/specs/2026-09-09-ingestion-review-cluster-splitting-design.md.
    # Reuses clusterize.resolve_cluster for the tight cores; a wrapper re-attaches loose
    # members so no candidate pair ever leaves the review queue.
    enabled: true
    max_group_size: 12
    # Tier A candidate pairs are all < 0.05; Tier B's are 0.05-0.12. Each tier's ladder
    # starts at its band top -- derived by _split_params (0.05 for tier_a, and
    # settings.DUPLICATES.THRESHOLD for tier_b), not configured here -- and tightens by
    # `decrement` until a group is small enough or the next step would fall below `floor`.
    tier_a: { decrement: 0.01, floor: 0.01 }
    tier_b: { decrement: 0.05, floor: 0.05 }

scheduler:
  # Opt-in per environment (see settings.metal.yaml / settings.general.yaml /
  # settings.it.yaml, which each set this true) rather than a global default here.
  # This file is also the only tracked config Dockerfile.backend's deployment path
  # loads with no per-environment overlay of its own selected, so a global `true`
  # here would silently try to run batch.trends_batch (not present in that image,
  # and its ML deps aren't installed there either) on every tick, with no
  # cross-worker locking across gunicorn's multiple uvicorn workers. See
  # docs/superpowers/specs/2026-07-27-batch-job-scheduler-design.md.
  enabled: false
  jobs:
    - name: trends_batch
      script: trends_batch
      batch_run_kind: trends
      interval_minutes: 360
      max_runtime_minutes: 60
      enabled: true
    - name: build_statistics
      script: build_statistics
      batch_run_kind: statistics
      interval_minutes: 60
      max_runtime_minutes: 10
      enabled: true
    # Every other job in environments/batch_registry.yaml (ingest_auto_prep, the tagging,
    # lemma, description and meme-profile jobs, rebuild_duplicates, clusterize, ...) is
    # deliberately NOT scheduled -- manual trigger only, via the /admin/batches UI. See
    # docs/batches/inventory.md for the full list and
    # docs/superpowers/specs/2026-08-14-batch-scheduling-rollout-design.md.
    # Exception: settings.general.yaml additionally schedules export_ratings (daily) and
    # import_judgments (weekly), which are meaningful on general only.

taxonomy:
  embedding_model: bge-large   # chosen in P1 (spec 2026-10-02-p1-taxonomy-and-data-model-design.md, decision 6)
  # Auto-neighbours from bge-large definition embeddings are effectively OFF: measured on
  # 2026-10-02, definition cosines max out at 0.81 and at every usable threshold (0.60 -> median 6
  # neighbours/key, 0.63 -> 3.5, 0.70 -> 0) they include opposites and unrelated keys. The
  # near-synonym pairs that matter are curated in batch/data/taxonomy/similarity_overrides.yaml
  # (editing it needs only a regenerated similarity.json: no version bump, no lock refresh,
  # no re-extraction). Lower this only after P6 shows embedding neighbours help.
  similarity_threshold: 0.9

meme_profiles:
  # Meme profile extraction (epic meme-from-text, P2; see
  # docs/superpowers/specs/2026-10-02-meme-from-text/2026-10-03-p2-meme-profile-extraction-design.md).
  # text_model is deliberately NOT here: it lives only in settings.metal.yaml / settings.general.yaml, and
  # its absence is how `it` opts out (both jobs then exit cleanly with "not configured").
  vision_model: qwen2.5vl:7b   # only candidate; pilot 2026-10-03: 6 of 10 runs valid, the 4 failures were 2 undecodable image files
  num_ctx: 8192
  batch_size: 50
  concurrent_requests: 2   # Ollama VRAM headroom, same cap as build_image_descriptions
  min_text_chars: 40       # below this much usable text the image takes the vision path
  max_note_chars: 600
  max_description_chars: 800
  max_ocr_chars: 800
  seed: 42
  # max_per_run: 500       # optional cap per description_pipeline run; unset = unlimited

profile_editor:
  # Meme-profile curator (epic meme-from-text, P5c). Time budget of the inline situation-vector refresh on save;
  # when it is exceeded the profile is still saved and the vector is refreshed by build_meme_profile_embeddings.
  embed_timeout_seconds: 8

parse:
  # Query understanding (epic meme-from-text, P3; see
  # docs/superpowers/specs/2026-10-02-meme-from-text/2026-10-05-p3-query-understanding-design.md).
  # model is deliberately NOT here: it lives only in settings.metal.yaml / settings.general.yaml, and
  # its absence is how `it` opts out.
  timeout_seconds: 5.0     # total budget for one parse including queueing (NFR-1: p95 8 s with retrieval)
  retry_min_seconds: 1.5   # retry an unusable answer only if at least this much of the budget remains
  max_concurrent: 2
  num_ctx: 8192            # keep equal to meme_profiles.num_ctx while both use the same model (Ollama reloads the model when num_ctx differs)
  seed: 42
  keep_alive: 30m          # keeps the model loaded between queries
  cache_size: 500
  max_input_chars: 600
  ollama_url: http://127.0.0.1:11434   # OLLAMA_HOST in the environment wins
