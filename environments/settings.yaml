ocr:
  confidence_min: 0.4
  lang_score_min: 0.3

rules:
  lemmatize: false

bow:
  min_word_length: 3
  min_frequency: 2
  text_source: ocr

lemma_clustering:
  text_scope: unmatched
  language: all
  min_cluster_size: 2
  selection_epsilon: 0.0
  selection_method: eom
  text_embed_model: sbert

concepts:
  lookup: false
  threshold: 0.2
  limit: 50

ollama:
  model: qwen2
  enabled: true

general:
  batch_size: 100
  progress_every: 10
  profile: general
  frontend_origin: http://localhost:5173
